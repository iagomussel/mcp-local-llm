name: Build and Deploy to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-binaries:
    name: Build Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            binary_name: mcp-local-llm-linux-x64
          - os: windows-latest
            platform: win32
            arch: x64
            binary_name: mcp-local-llm-win-x64.exe
          - os: macos-latest
            platform: darwin
            arch: x64
            binary_name: mcp-local-llm-darwin-x64
          - os: macos-latest
            platform: darwin
            arch: arm64
            binary_name: mcp-local-llm-darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pkg globally
        shell: bash
        run: pnpm install -g pkg

      - name: Create dist directory
        shell: bash
        run: mkdir -p dist

      - name: Build binary
        shell: bash
        run: |
          pkg src/index.js \
            --targets node18-${{ matrix.platform }}-${{ matrix.arch }} \
            --output dist/${{ matrix.binary_name }} \
            --compress GZip

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/${{ matrix.binary_name }}*
          retention-days: 30

  prepare-npm-package:
    name: Prepare npm Package
    needs: build-binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION#v}"

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Create npm package structure
        run: |
          mkdir -p npm-package/bin
          
          # Copy all binaries
          find binaries -type f -name "mcp-local-llm-*" -exec cp {} npm-package/bin/ \;
          find binaries -type f -name "*.exe" -exec cp {} npm-package/bin/ \;
          
          # Make binaries executable (Linux/macOS)
          chmod +x npm-package/bin/mcp-local-llm-linux-x64 || true
          chmod +x npm-package/bin/mcp-local-llm-darwin-x64 || true
          chmod +x npm-package/bin/mcp-local-llm-darwin-arm64 || true
          
          # Create wrapper script that detects platform (works on all platforms)
          cat > npm-package/bin/mcp-local-llm.js << 'EOF'
          #!/usr/bin/env node
          const { spawn } = require('child_process');
          const path = require('path');
          const os = require('os');
          const fs = require('fs');
          
          const platform = os.platform();
          const arch = os.arch();
          
          const binaries = {
            'linux-x64': 'mcp-local-llm-linux-x64',
            'darwin-x64': 'mcp-local-llm-darwin-x64',
            'darwin-arm64': 'mcp-local-llm-darwin-arm64',
            'win32-x64': 'mcp-local-llm-win-x64.exe'
          };
          
          const binaryKey = `${platform}-${arch}`;
          const binaryName = binaries[binaryKey];
          
          if (!binaryName) {
            console.error(`Unsupported platform: ${platform}-${arch}`);
            console.error(`Supported platforms: ${Object.keys(binaries).join(', ')}`);
            process.exit(1);
          }
          
          const binDir = __dirname;
          const binaryPath = path.join(binDir, binaryName);
          
          if (!fs.existsSync(binaryPath)) {
            console.error(`Binary not found: ${binaryPath}`);
            console.error(`Available files in bin directory:`);
            try {
              const files = fs.readdirSync(binDir);
              files.forEach(file => console.error(`  - ${file}`));
            } catch (e) {
              console.error(`  (could not read directory)`);
            }
            process.exit(1);
          }
          
          // Make binary executable on Unix systems
          if (platform !== 'win32') {
            try {
              fs.chmodSync(binaryPath, 0o755);
            } catch (e) {
              // Ignore chmod errors
            }
          }
          
          // Spawn the binary with all arguments
          const child = spawn(binaryPath, process.argv.slice(2), {
            stdio: 'inherit',
            cwd: process.cwd(),
            env: process.env
          });
          
          child.on('error', (err) => {
            console.error(`Failed to start binary: ${err.message}`);
            process.exit(1);
          });
          
          child.on('exit', (code) => {
            process.exit(code !== null ? code : 0);
          });
          
          // Handle signals
          process.on('SIGINT', () => {
            child.kill('SIGINT');
          });
          
          process.on('SIGTERM', () => {
            child.kill('SIGTERM');
          });
          EOF
          
          chmod +x npm-package/bin/mcp-local-llm.js
          
          # Create package.json for npm
          cat > npm-package/package.json << EOF
          {
            "name": "mcp-local-llm",
            "version": "${{ steps.version.outputs.version }}",
            "description": "MCP server that uses a local LLM to respond to queries - Binary distribution",
            "main": "bin/mcp-local-llm",
            "bin": {
              "mcp-local-llm": "./bin/mcp-local-llm.js"
            },
            "keywords": [
              "mcp",
              "llm",
              "local",
              "ai",
              "binary"
            ],
            "author": "",
            "license": "MIT",
            "engines": {
              "node": ">=18.0.0"
            },
            "files": [
              "bin/",
              "README.md",
              "package.json"
            ],
            "os": [
              "linux",
              "darwin",
              "win32"
            ],
            "cpu": [
              "x64",
              "arm64"
            ]
          }
          EOF
          
          # Create README for npm
          cat > npm-package/README.md << 'EOF'
          # mcp-local-llm
          
          MCP server that uses a local LLM to respond to queries - Binary distribution
          
          ## Quick Start
          
          Use directly with npx (no installation needed):
          
          ```bash
          npx mcp-local-llm
          ```
          
          ## Installation
          
          Install globally:
          
          ```bash
          npm install -g mcp-local-llm
          ```
          
          Then use:
          
          ```bash
          mcp-local-llm
          ```
          
          Or install as a dependency:
          
          ```bash
          npm install mcp-local-llm
          ```
          
          Then use:
          
          ```bash
          npx mcp-local-llm
          ```
          
          Or directly:
          
          ```bash
          node_modules/.bin/mcp-local-llm
          ```
          
          ## Configuration
          
          The server can be configured using environment variables:
          
          ```bash
          export OLLAMA_URL=http://localhost:11434
          export MODEL_NAME=llama3
          export MAX_TOKENS=256
          export TEMPERATURE=0.7
          ```
          
          ## Supported Platforms
          
          - Linux (x64)
          - Windows (x64)
          - macOS (x64 and ARM64)
          
          ## Requirements
          
          - Node.js 18 or higher
          - Ollama installed and running (https://ollama.ai/)
          
          ## License
          
          MIT
          EOF

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm-package/
          retention-days: 30

  publish-to-npm:
    name: Publish to npm
    needs: prepare-npm-package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Publish to npm
        run: |
          cd npm-package
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    name: Create GitHub Release
    needs: [build-binaries, prepare-npm-package]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Create release archive
        run: |
          mkdir -p release
          find binaries -type f -name "mcp-local-llm-*" -exec cp {} release/ \;
          find binaries -type f -name "*.exe" -exec cp {} release/ \;
          chmod +x release/* || true
          cd release
          zip -r ../mcp-local-llm-${{ steps.version.outputs.version }}-binaries.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mcp-local-llm-*-binaries.zip
          draft: false
          prerelease: false
          generate_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
